[package]
name = "cpa-stg"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Credential admission policies for the CLIProxyAPI native plugin ABI"
license = "MIT"

[features]
router = []

[workspace]
members = ["router"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
