[package]
name = "cpa-stg-router"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "cpa_stg_router"
path = "../src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["router"]
router = []

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
